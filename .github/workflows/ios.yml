name: iOS CI

on:
  push:
    branches: [ main, test-google-auth ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    name: Build and Test
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show directory structure
      run: |
        echo "=== Repository root ==="
        ls -la
        echo "=== sbud directory ==="
        ls -la sbud/
        echo "=== Xcode project ==="
        ls -la sbud/sbud.xcodeproj/
    
    - name: List schemes
      working-directory: sbud
      run: xcodebuild -list -project sbud.xcodeproj
    
    - name: List available simulators
      run: xcrun simctl list devices available iPhone
    
    - name: Build and Test
      working-directory: sbud
      run: |
        # Get the first available iPhone simulator with iOS 26
        DEVICE=$(xcrun simctl list devices available iPhone | grep "iOS 26" -A 1 | grep "iPhone 17 Pro" | head -1 | sed 's/ (.*//g' | xargs)
        
        if [ -z "$DEVICE" ]; then
          echo "iPhone 17 Pro not found, using first available iPhone"
          DEVICE=$(xcrun simctl list devices available iPhone | grep "iPhone" | head -1 | sed 's/ (.*//g' | xargs)
        fi
        
        echo "Using device: $DEVICE"
        
        # Build and test without specifying OS version (use latest available)
        xcodebuild test \
          -scheme sbud \
          -project sbud.xcodeproj \
          -destination "platform=iOS Simulator,name=$DEVICE,OS=latest" \
          -enableCodeCoverage YES \
          -derivedDataPath DerivedData \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO
    
    - name: Generate code coverage
      if: success()
      working-directory: sbud
      run: |
        xcrun llvm-cov export \
          -format="lcov" \
          DerivedData/Build/ProfileData/*/Coverage.profdata \
          -instr-profile DerivedData/Build/ProfileData/*/Coverage.profdata \
          DerivedData/Build/Products/Debug-iphonesimulator/sbud.app/sbud \
          > coverage.lcov
      continue-on-error: true
    
    - name: Upload coverage to Codecov
      if: success()
      uses: codecov/codecov-action@v4
      with:
        files: sbud/coverage.lcov
        flags: unittests
        fail_ci_if_error: false
      continue-on-error: true
    
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: sbud/DerivedData/Logs/Test/*.xcresult
        retention-days: 30
  
  lint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install SwiftLint
      run: brew install swiftlint
    
    - name: Run SwiftLint
      working-directory: sbud
      run: |
        if [ -f ".swiftlint.yml" ]; then
          swiftlint lint --reporter github-actions-logging
        elif [ -f "../.swiftlint.yml" ]; then
          cd .. && swiftlint lint --reporter github-actions-logging
        else
          echo "No .swiftlint.yml found, running with defaults..."
          swiftlint lint --reporter github-actions-logging
        fi
      continue-on-error: true