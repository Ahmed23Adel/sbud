name: iOS CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.2'  
        
    - name: Cache Swift Package Manager
      uses: actions/cache@v3
      with:
        path: |
          .build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
          
    - name: Install dependencies
      run: |
        echo "Dependencies will be resolved during build"
        
    - name: Run tests
      run: |
        xcodebuild test \
          -scheme sbud \
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2' \
          -enableCodeCoverage YES \
          -derivedDataPath DerivedData \
          | xcpretty && exit ${PIPESTATUS[0]}
      continue-on-error: false
      
    - name: Generate code coverage report
      run: |
        xcrun llvm-cov export \
          -format="lcov" \
          DerivedData/Build/ProfileData/*/Coverage.profdata \
          -instr-profile DerivedData/Build/ProfileData/*/Coverage.profdata \
          DerivedData/Build/Products/Debug-iphonesimulator/sbud.app/sbud \
          > coverage.lcov
      continue-on-error: true
      
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.lcov
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
      
    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          DerivedData/Logs/Test/*.xcresult
        retention-days: 30
        
  lint:
    name: SwiftLint
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install SwiftLint
      run: brew install swiftlint
      
    - name: Run SwiftLint
      run: swiftlint lint --reporter github-actions-logging
      continue-on-error: true  # Set to false to make lint failures block PRs
      
  build:
    name: Build App
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.4'
        
    - name: Build for testing
      run: |
        xcodebuild build-for-testing \
          -scheme sbud \
          -destination 'platform=iOS Simulator,name=iPhone 15,OS=17.5' \
          -derivedDataPath DerivedData \
          | xcpretty && exit ${PIPESTATUS[0]}
          
  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [test, build]
    if: always()
    
    steps:
    - name: Check test results
      run: |
        if [ "${{ needs.test.result }}" == "failure" ]; then
          echo "Tests failed"
          exit 1
        fi
        if [ "${{ needs.build.result }}" == "failure" ]; then
          echo "Build failed"
          exit 1
        fi
        echo "All checks passed!"